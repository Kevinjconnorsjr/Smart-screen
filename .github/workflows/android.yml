# Builds the Smart Screen Android app and publishes it on the "Android app" release page,
# so it can be downloaded straight to a phone:
#   https://github.com/Kevinjconnorsjr/Smart-screen/releases/tag/android-app
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        env:
          # Optional (see README "Phone app"): a permanent signing key, so new versions install
          # over old ones. Without it each build has its own key.
          SMART_SCREEN_KEYSTORE_B64: ${{ secrets.SMART_SCREEN_KEYSTORE_B64 }}
          SMART_SCREEN_KEYSTORE_PASSWORD: ${{ secrets.SMART_SCREEN_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk SmartScreen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartScreen-apk
          path: android/SmartScreen.apk

      - name: Publish to the "Android app" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-app >/dev/null 2>&1; then
            gh release create android-app --target main --title "Smart Screen Android app" \
              --notes "Open this page on your Android phone and tap **SmartScreen.apk** to install. See the README section \"Phone app\"."
          fi
          gh release upload android-app SmartScreen.apk --clobber
