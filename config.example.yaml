# Copy this file to config.yaml and edit it. Settings you leave out use the values here.
# After editing: sudo systemctl restart smart-screen

display:
  style: photos            # photos = photo slideshow background (regular monitor)
                           # mirror = black background (for a two-way mirror build)
  orientation: landscape   # landscape | portrait (monitor standing on its side)
  portrait_turned: right   # portrait only: which way the monitor was turned (right | left);
                           # if the picture is upside down, switch this
  layout: left             # left | right: which side the clock and calendar are on
  theme:
    accent_color: "#ffd36e"    # highlight color (day names, "now" badges, progress ring)
    text_size: 1.0             # 0.7 (small) to 1.5 (big)
    card_opacity: 0.5          # how dark the boxes behind the weather and calendar are (0-1)
    photo_dim: 0.35            # darkens the photos so the text stays readable (0-1)
  show:                    # turn parts of the screen on or off
    clock: true
    date: true
    greeting: true
    weather: true
    forecast: true
    calendar: true
    messages: true
    news: true
    gesture_help: true
  clock_24h: false
  show_seconds: false
  greeting: "Good {part_of_day}"   # e.g. "Good morning, Connors family!" - {part_of_day} = morning/afternoon/evening
  messages:                # one shows at a time, changing every minute; remove all to hide
    - "Hold up ✌️ for the photo booth"
    - "👍 lights on · 👎 lights off"
    - "Make today great"
  weather:                 # free, no API key (open-meteo.com); delete this block to hide weather
    latitude: 40.71        # find yours: right-click a spot in Google Maps
    longitude: -74.01
    units: fahrenheit      # fahrenheit | celsius

  # Screen sleep. The screen goes dark after this many minutes without a gesture
  # (0 = never). Raising your hand wakes it up.
  sleep_after_minutes: 0
  always_on_hours: "07:00-22:00"   # never sleeps during these hours; "" = no exception
  wake_on_hand: true
  # Leave empty to just show a black screen. To really power the monitor off and on (saves
  # power), use the helper script: deploy/screen.sh off / deploy/screen.sh on
  screen_off_command: ""
  screen_on_command: ""

  host: 127.0.0.1          # with remote.enabled the server is reachable on your Wi-Fi (paired phones only)
  port: 8080

remote:                    # the Smart Screen phone app (see README "Phone app")
  enabled: true
  name: "Smart Screen"     # how this screen shows up in the app

slideshow:
  folders: [backgrounds]   # put your photos in the backgrounds/ folder (subfolders are fine)
  include_booth_photos: true   # mix photo booth shots into the slideshow
  seconds_per_photo: 30
  tiles: 1                 # photos/videos on screen at once: 1-6 (a collage when more than 1)
  include_videos: true     # play videos from the folders too (shown silently)
  videos_at_once: 1        # most videos playing at the same time (the Pi 5 handles 1-2 smoothly)
  video_max_seconds: 60    # longer videos are cut to this length on the screen
  size: [1920, 1080]       # your screen's resolution; photos are resized to this once and cached

cloud:                     # show a Google Drive folder (see README "Google Drive photos")
  enabled: false
  remote: gdrive           # made by deploy/connect-google-drive.sh
  folder: "Smart Screen"   # the Drive folder to show (subfolders included)
  shared_with_me: false    # true if the folder was shared with you by someone else
  every_minutes: 30        # how often to check for new photos
  max_file_mb: 500         # skip files bigger than this

alexa:                     # "Alexa, turn on the photo booth" (see README "Alexa")
  voice_commands: false
  devices:                 # each shows up in the Alexa app as a smart plug with this name
    - name: Photo booth
      "on": photo_booth
      "off": ""
    - name: Smart screen
      "on": wake
      "off": sleep

calendar:
  days_ahead: 7
  max_events: 10
  refresh_minutes: 10
  feeds:                   # as many as you like; see README "Calendar" for how to get the link
    - name: Family
      url: "PASTE-SECRET-ICAL-LINK-HERE"
      color: "#7cc4ff"
    # - name: Work
    #   url: "https://outlook.office365.com/owa/calendar/.../calendar.ics"
    #   color: "#ffb86b"

news:                      # headlines ticker at the bottom; delete the feeds to hide it
  refresh_minutes: 30
  per_feed: 5
  feeds:
    - name: NYT
      url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    # - name: BBC
    #   url: https://feeds.bbci.co.uk/news/rss.xml

camera:
  backend: opencv          # opencv (USB webcam) | picamera2 (Raspberry Pi Camera Module)
  index: 0                 # which USB camera (opencv only)
  width: 1920
  height: 1080
  fps: 30
  rotate: 0                # 90 / 180 / 270 if the camera is mounted sideways or upside down

gestures:
  model_path: models/gesture_recognizer.task
  min_score: 0.65          # how confident the model must be (0-1)
  hold_seconds: 0.8        # hold a gesture this long to fire it (stops accidental triggers)
  cooldown_seconds: 2.5    # wait after an action before another one can fire
  max_fps: 15              # how often to look for gestures (lower = more CPU for everything else)
  # Gestures the built-in model knows:
  #   Open_Palm, Closed_Fist, Pointing_Up, Thumb_Up, Thumb_Down, Victory, ILoveYou
  # Actions: lights_on, lights_off, lights_toggle, photo_booth, wake, sleep
  bindings:
    Thumb_Up: lights_on
    Thumb_Down: lights_off
    Pointing_Up: lights_toggle
    Victory: photo_booth
    Open_Palm: wake
    Closed_Fist: sleep

connections:               # logins shared by lights, devices and cameras (see README "Devices")
  home_assistant:
    url: ""                # e.g. http://homeassistant.local:8123
    token: ""              # Home Assistant: profile -> Security -> Long-lived access tokens
  voice_monkey:
    token: ""              # for Alexa routines: app.voicemonkey.io/tokens

devices: []                # things gestures, Alexa and the app can switch on/off (fans, plugs, scenes…)
# Example (easiest to add in the phone app: Settings -> Devices):
#   devices:
#     - name: Fan
#       type: home_assistant   # home_assistant | alexa | webhook
#       entity_id: switch.fan  # home_assistant: e.g. switch.fan, light.lamp, scene.movie_night
#     - name: Bedroom lamp
#       type: alexa            # runs Alexa routines through Voice Monkey
#       on_routine: bedroom-lamp-on-1a2b
#       off_routine: bedroom-lamp-off-3c4d
#     - name: Garage light
#       type: webhook
#       on_url: http://192.168.1.60/relay/0?turn=on
#       off_url: http://192.168.1.60/relay/0?turn=off

cameras:                   # security cameras on the screen (see README "Cameras")
  show_seconds: 60         # how long they stay up when shown by a gesture or Alexa
  list: []                 # e.g. - {name: Front door, url: "rtsp://user:password@192.168.1.50:554/stream2"}
                           #      - {name: Driveway, url: "ha:camera.driveway"}

lights:
  backend: none            # none | home_assistant | hue | alexa | webhook

  home_assistant:
    url: http://homeassistant.local:8123
    token: "PASTE-A-LONG-LIVED-ACCESS-TOKEN"   # HA profile -> Security -> Long-lived access tokens
    entity_ids: [light.living_room]

  hue:
    bridge_ip: 192.168.1.50
    username: "PASTE-HUE-API-USERNAME"         # see README: "Philips Hue"
    light_ids: [1, 2]

  webhook:                 # anything with a URL: Shelly, Tasmota, IFTTT, Node-RED, ...
    method: POST
    on_url: ""
    off_url: ""
    urls:                  # optional extra links: dim, bright, warm, cool, party, red, blue, ...
      dim: ""
      bright: ""

  alexa:                   # lights that live in the Alexa app, run through Alexa routines
    token: "PASTE-VOICE-MONKEY-TOKEN"   # from app.voicemonkey.io/tokens (see README "Alexa")
    routines:              # Voice Monkey routine trigger ID for each action you want ("" = not used)
      "on": ""
      "off": ""
      dim: ""
      bright: ""
      warm: ""
      cool: ""
      party: ""

photobooth:
  countdown_seconds: 3
  shots: 4                 # photos per session
  seconds_between_shots: 2
  layout: strip            # strip (two 2x6 strips on 4x6 paper) | grid (2x2 on 4x6) | single
  caption: "Photo Booth"
  output_dir: photos
  mirror_preview: true     # live preview on screen works like a mirror (feels natural)
  mirror_photos: false     # false = prints show the scene the right way round (readable text)
  screen_flash: true       # screen goes white during each shot = built-in fill light
  print: true
  printer: ""              # CUPS printer name; empty = system default (see `lpstat -p`)
  print_options: ["-o", "fit-to-page"]
  copies: 1
