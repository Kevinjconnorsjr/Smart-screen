<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Display</title>
  <link rel="stylesheet" href="/static/mirror.css">
</head>
<body>
  <!-- Photo slideshow: two layers that cross-fade -->
  <div id="bg" class="bg-wrap" aria-hidden="true">
    <div class="bg"></div>
    <div class="bg"></div>
    <div class="scrim"></div>
  </div>

  <main id="dash">
    <section class="clock">
      <div class="time"><span id="time">--:--</span><span id="ampm" class="ampm"></span><span id="secs" class="secs"></span></div>
      <div id="date" class="date"></div>
      <div id="greeting" class="greeting"></div>
    </section>

    <section id="weather" class="weather card" hidden>
      <div class="now">
        <span id="w-icon" class="w-icon"></span>
        <span id="temp" class="temp"></span>
      </div>
      <div id="sky" class="sky"></div>
      <div id="sun" class="sun"></div>
      <ol id="forecast" class="forecast"></ol>
    </section>

    <section id="agenda" class="agenda card" hidden>
      <h2>Coming up</h2>
      <div id="events"></div>
    </section>

    <footer class="footer">
      <div class="footer-left">
        <div id="message" class="message"></div>
        <div id="news" class="news" hidden><span id="news-source" class="news-source"></span><span id="news-title"></span></div>
      </div>
      <div class="footer-right">
        <div id="lights" class="pill" hidden>💡 Lights on</div>
        <ul id="legend" class="legend"></ul>
      </div>
    </footer>
  </main>

  <div id="hold" class="hold" hidden>
    <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle id="ring" class="ring" cx="50" cy="50" r="44"/></svg>
    <span id="hold-label"></span>
  </div>

  <!-- Photo booth: live camera preview with the countdown on top -->
  <section id="booth" class="booth" hidden>
    <img id="preview" class="preview" alt="">
    <div id="shot-label" class="shot-label"></div>
    <div id="countdown" class="countdown"></div>
  </section>

  <div id="status" class="status" hidden></div>
  <figure id="photo" class="photo" hidden><img id="photo-img" alt="Your photo strip"></figure>
  <div id="flash" class="flash" hidden></div>
  <div id="night" class="night"></div>
  <div id="pair" class="pair" hidden>
    <div class="pair-box">
      <div class="pair-title">📱 Pair the Smart Screen app</div>
      <div id="pair-code" class="pair-code"></div>
      <div class="pair-hint">Type this code on your phone · <span id="pair-left"></span></div>
    </div>
  </div>

  <script src="/static/mirror.js"></script>
</body>
</html>
