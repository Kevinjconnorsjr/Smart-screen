<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Smart Screen</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/remote/remote.css">
</head>
<body>
  <!-- Pairing (first time only) -->
  <section id="pair-view" class="pair-view" hidden>
    <div class="pair-card">
      <div class="logo">📺</div>
      <h1>Connect to your Smart Screen</h1>
      <p class="muted">For security, the screen shows a code that you type here. You only do this once.</p>
      <button id="pair-start" class="btn primary wide">Show code on the screen</button>
      <form id="pair-form" class="pair-form" hidden>
        <label for="pair-code" class="muted">Code shown on the screen</label>
        <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123 456">
        <button class="btn primary wide" type="submit">Connect</button>
      </form>
      <p id="pair-error" class="error" hidden></p>
    </div>
  </section>

  <!-- The app -->
  <div id="app" class="app" hidden>
    <header class="top">
      <h1 id="title">Smart Screen</h1>
      <span id="save-state" class="save-state"></span>
    </header>

    <div id="preview-wrap" class="preview-wrap">
      <div id="preview-box" class="preview-box"><iframe id="preview" title="Live preview of the screen" tabindex="-1"></iframe></div>
    </div>

    <main id="pages">
      <section class="page" data-page="home"></section>
      <section class="page" data-page="look" hidden></section>
      <section class="page" data-page="info" hidden></section>
      <section class="page" data-page="photos" hidden></section>
      <section class="page" data-page="more" hidden></section>
    </main>

    <nav class="tabs">
      <button data-tab="home" class="on"><span>🏠</span>Home</button>
      <button data-tab="look"><span>🎨</span>Look</button>
      <button data-tab="info"><span>📅</span>Content</button>
      <button data-tab="photos"><span>🖼️</span>Photos</button>
      <button data-tab="more"><span>⚙️</span>Settings</button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>
  <dialog id="viewer" class="viewer"><img id="viewer-img" alt=""><video id="viewer-video" muted playsinline controls loop hidden></video><form method="dialog"><button class="btn" onclick="document.getElementById('viewer-video').pause()">Close</button></form></dialog>

  <script src="/static/remote/remote.js"></script>
</body>
</html>
